name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  scorecard-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install like the community scanner
        run: |
          npm ci --ignore-scripts
          test -f node_modules/obsidian/obsidian.d.ts
          npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Lint, test, and build
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
